function Ticket({ items, total, onRemove, onQty }) {
  return (
    <div className="flex flex-col h-full">
      <div className="px-5 pt-5 pb-4" style={{ backgroundImage: `repeating-linear-gradient(90deg, ${C.border} 0 6px, transparent 6px 12px)`, backgroundSize: "100% 3px", backgroundPosition: "bottom", backgroundRepeat: "no-repeat" }}>
        <p className="text-[11px] tracking-[0.2em] uppercase" style={{ fontFamily: "'JetBrains Mono', monospace", color: C.muted }}>Reçu de recharge</p>
        <h3 className="text-xl mt-1" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.text }}>Panier</h3>
      </div>
      <div className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
        {items.length === 0 && <p className="text-sm mt-8 text-center" style={{ color: C.muted }}>Ton panier est vide.<br/>Choisis une recharge pour commencer.</p>}
        {items.map((it) => (
          <div key={it.key} className="flex items-center justify-between gap-3 pb-3" style={{ borderBottom: `1px dashed ${C.border}` }}>
            <div className="min-w-0">
              <p className="text-sm font-medium truncate" style={{ color: C.text }}>{it.name}</p>
              <p className="text-xs" style={{ color: C.muted }}>{it.label}</p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={() => onQty(it.key, -1)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ border: `1px solid ${C.border}`, color: C.text }}><Icon name="minus" size={12} /></button>
              <span className="text-sm w-4 text-center" style={{ fontFamily: "'JetBrains Mono', monospace", color: C.text }}>{it.qty}</span>
              <button onClick={() => onQty(it.key, 1)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ border: `1px solid ${C.border}`, color: C.text }}><Icon name="plus" size={12} /></button>
              <span className="text-sm w-16 text-right" style={{ fontFamily: "'JetBrains Mono', monospace", color: C.text }}>{fmt(it.price * it.qty)}</span>
              <button onClick={() => onRemove(it.key)} style={{ color: C.muted }}><Icon name="close" size={14} /></button>
            </div>
          </div>
        ))}
      </div>
      {items.length > 0 && (
        <div className="px-5 py-4" style={{ backgroundImage: `repeating-linear-gradient(90deg, ${C.border} 0 6px, transparent 6px 12px)`, backgroundSize: "100% 3px", backgroundPosition: "top", backgroundRepeat: "no-repeat" }}>
          <div className="flex justify-between items-baseline">
            <span className="text-xs uppercase tracking-wide" style={{ color: C.muted, fontFamily: "'JetBrains Mono', monospace" }}>Total</span>
            <span className="text-2xl" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.purple }}>{fmt(total)}</span>
          </div>
        </div>
      )}

  );
}

function CheckoutModal({ items, total, onClose, onConfirm }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [gameId, setGameId] = useState("");
  const [payment, setPayment] = useState("MonCash");
  const [reference, setReference] = useState("");
  const [sent, setSent] = useState(false);
  const [orderId, setOrderId] = useState("");
  const needsId = items.some((it) => it.needsId);
  const inputStyle = { border: `1px solid ${C.border}`, background: C.surface2, color: C.text };

  const handleSubmit = (e) => {
    e.preventDefault();
    const id = makeOrderId();
    const order = { id, name, phone, gameId, payment, reference, items, total, status: "en_attente", createdAt: new Date().toISOString() };
    try {
      const existing = JSON.parse(localStorage.getItem("ns_orders") || "[]");
      existing.push(order);
      localStorage.setItem("ns_orders", JSON.stringify(existing));
    } catch (err) { console.error(err); }
    setOrderId(id);
    setSent(true);
  };

  if (sent) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.7)" }}>
        <div className="rounded-2xl max-w-sm w-full p-8 text-center" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="w-14 h-14 rounded-full mx-auto flex items-center justify-center mb-4" style={{ background: "#22C55E1A" }}><Icon name="check" size={26} color={C.green} /></div>
          <h3 className="text-lg mb-2" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.text }}>Commande enregistrée</h3>
          <p className="text-xs mb-3" style={{ fontFamily: "'JetBrains Mono', monospace", color: C.muted }}>Référence commande : {orderId}</p>
          <p className="text-sm mb-6" style={{ color: C.muted }}>Merci {name || "cher client"} ! Ta commande de {fmt(total)} est en attente de validation. On confirme ton paiement {payment} et on te livre dès que possible.</p>
          <a href={`https://wa.me/50938223773?text=${encodeURIComponent(`Bonjour, commande ${orderId} — ${fmt(total)} (${name || "client"}), paiement ${payment}, référence transaction: ${reference}.`)}`} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-5 py-3 rounded-full text-sm font-medium text-white w-full justify-center" style={{ background: C.green }}>
            <Icon name="whatsapp" size={16} /> Ouvrir WhatsApp
          </a>
          <button onClick={() => { onConfirm(); onClose(); }} className="mt-3 text-sm w-full py-2" style={{ color: C.muted }}>Fermer</button>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.7)" }}>
      <form onSubmit={handleSubmit} className="rounded-2xl max-w-sm w-full p-6 max-h-[90vh] overflow-y-auto" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.text }}>Finaliser la commande</h3>
          <button type="button" onClick={onClose}><Icon name="close" size={18} color={C.muted} /></button>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs" style={{ color: C.muted }}>Nom complet</label>
            <input required value={name} onChange={(e) => setName(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-lg text-sm outline-none" style={inputStyle} placeholder="Ex: Naruto Uzumaki" />
          </div>
          <div>
            <label className="text-xs" style={{ color: C.muted }}>Numéro WhatsApp</label>
            <input required value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-lg text-sm outline-none" style={inputStyle} placeholder="+509 xx xx xx xx" />
          </div>
          {needsId && (
            <div>
              <label className="text-xs" style={{ color: C.muted }}>ID de jeu / Email (pour chaque article)</label>
              <textarea required value={gameId} onChange={(e) => setGameId(e.target.value)} rows={2} className="w-full mt-1 px-3 py-2 rounded-lg text-sm outline-none resize-none" style={inputStyle} placeholder="Indique ton ID ou email pour chaque recharge" />
            </div>
          )}
          <div>
            <label className="text-xs" style={{ color: C.muted }}>Mode de paiement</label>
            <div className="flex gap-2 mt-1">
              {["MonCash", "NatCash"].map((m) => (
                <button type="button" key={m} onClick={() => setPayment(m)} className="flex-1 py-2 rounded-lg text-xs font-medium" style={{ border: payment === m ? `1.5px solid ${C.purple}` : `1px solid ${C.border}`, background: payment === m ? "#8B5CF61A" : C.surface2, color: payment === m ? C.purple : C.muted }}>{m}</button>
              ))}
            </div>
            <div className="mt-2 px-3 py-2.5 rounded-lg text-xs" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
              <p style={{ color: C.muted }}>Envoie le paiement à ce numéro {payment} :</p>
              <p className="mt-0.5 text-sm" style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, color: C.text }}>{PAYMENT_ACCOUNTS[payment].number}</p>
              <p style={{ color: C.muted }}>{PAYMENT_ACCOUNTS[payment].name}</p>
            </div>
          </div>
          <div>
            <label className="text-xs" style={{ color: C.muted }}>Numéro de référence de la transaction {payment}</label>
            <input required value={reference} onChange={(e) => setReference(e.target.value)} className="w-full mt-1 px-3 py-2 rounded-lg text-sm outline-none" style={{ ...inputStyle, fontFamily: "'JetBrains Mono', monospace" }} placeholder="Ex: 8842193" />
          </div>
        </div>
        <div className="flex justify-between items-baseline mt-5 pt-4" style={{ borderTop: `1px dashed ${C.border}` }}>
          <span className="text-xs uppercase" style={{ color: C.muted }}>Total à payer</span>
          <span className="text-xl" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.purple }}>{fmt(total)}</span>
        </div>
        <button type="submit" className="w-full mt-4 py-3 rounded-full text-sm font-medium text-white" style={{ background: C.purple }}>Confirmer la commande</button>
      </form>
    </div>
  );
}

function AdminPanel({ onClose }) {
  const [pin, setPin] = useState("");
  const [authed, setAuthed] = useState(false);
  const [orders, setOrders] = useState([]);
  const [error, setError] = useState("");

  const loadOrders = () => {
    try {
      const list = JSON.parse(localStorage.getItem("ns_orders") || "[]");
      list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      setOrders(list);
    } catch { setError("Impossible de charger les commandes."); }
  };

  useEffect(() => { if (authed) loadOrders(); }, [authed]);

  const updateStatus = (order, status) => {
    const updated = orders.map((o) => (o.id === order.id ? { ...o, status } : o));
    setOrders(updated);
    localStorage.setItem("ns_orders", JSON.stringify(updated));
  };

  if (!authed) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.7)" }}>
        <form onSubmit={(e) => { e.preventDefault(); if (pin === ADMIN_PIN) setAuthed(true); else setError("Code incorrect."); }} className="rounded-2xl max-w-xs w-full p-6" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-base flex items-center gap-2" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.text }}><Icon name="lock" size={16} /> Espace admin</h3>
            <button type="button" onClick={onClose}><Icon name="close" size={18} color={C.muted} /></button>
          </div>
          <input type="password" autoFocus value={pin} onChange={(e) => setPin(e.target.value)} className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ border: `1px solid ${C.border}`, background: C.surface2, color: C.text }} placeholder="Code PIN" />
          {error && <p className="text-xs mt-2" style={{ color: "#F87171" }}>{error}</p>}
          <button type="submit" className="w-full mt-4 py-2.5 rounded-full text-sm font-medium text-white" style={{ background: C.purple }}>Entrer</button>
        </form>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.7)" }}>
      <div className="rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between px-6 py-4" style={{ borderBottom: `1px solid ${C.border}` }}>
          <h3 className="text-lg" style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, color: C.text }}>Commandes ({orders.length})</h3>
          <div className="flex items-center gap-3">
            <button onClick={loadOrders} style={{ color: C.muted }}><Icon name="refresh" size={16} /></button>
            <button onClick={onClose}><Icon name="close" size={18} color={C.muted} /></button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto px-6 py-4 space-y-3">
          {!orders.length && <p className="text-sm text-center py-10" style={{ color: C.muted }}>Aucune commande pour l'instant.</p>}
          {orders.map((o) => {

                  <span className="px-2.5 py-1 rounded-full text-[11px] font-medium" style={{ background: `${st.color}1A`, color: st.color }}>{st.label}</span>

                {o.gameId && <p className="mt-1 text-xs" style={{ color: C.muted }}>ID/Email : {o.gameId}</p>}
                <p className="mt-1 text-xs" style={{ color: C.muted }}>Paiement : {o.payment} · Réf : <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{o.reference}</span></p>
                <div className="flex items-center justify-between mt-3">
                  <span className="text-sm font-semibold" style={{ color: C.text }}>{fmt(o.total)}</span>
                  <div className="flex gap-2">
                    <button onClick={() => updateStatus(o, "valide")} className="px-3 py-1.5 rounded-full text-xs font-medium" style={{ border: `1px solid ${C.purple}`, color: C.purple }}>Valider</button>

                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ChatBot({ onClose }) {
  const [messages, setMessages] = useState([{ role: "assistant", text: "Bonjour ! Je suis l'assistant N.S. Pose-moi une question sur les prix, jeux, abonnements ou le paiement." }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);
  useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" }); }, [messages, loading]);

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    const newMessages = [...messages, { role: "user", text }];
    setMessages(newMessages);
    setInput("");
    setLoading(true);
    try {
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: newMessages }),
      });
      const data = await res.json();
      const reply = data.reply || "Désolé, je n'ai pas pu répondre. Contacte-nous sur WhatsApp.";
      setMessages((m) => [...m, { role: "assistant", text: reply }]);
    } catch (err) {
      setMessages((m) => [...m, { role: "assistant", text: "Une erreur est survenue. Écris-nous sur WhatsApp au +509 38 22 3773." }]);
    }
    setLoading(false);
  };

  return (
    <div className="fixed bottom-24 right-5 z-50 w-[calc(100%-2.5rem)] max-w-sm rounded-2xl shadow-2xl flex flex-col overflow-hidden" style={{ height: "min(70vh, 480px)", border: `1px solid ${C.border}`, background: C.surface }}>
      <div className="flex items-center justify-between px-4 py-3" style={{ background: C.purpleDark }}>
        <div className="flex items-center gap-2 text-white text-sm font-medium"><Icon name="bot" size={16} color={C.gold} /> Assistant N.S</div>
        <button onClick={onClose}><Icon name="close" size={16} color="white" /></button>
      </div>
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-3">
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div className="max-w-[85%] px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap" style={{ background: m.role === "user" ? C.purple : C.surface2, color: m.role === "user" ? "white" : C.text }}>{m.text}</div>
          </div>
        ))}
        {loading && (
          <div className="flex justify-start">
            <div className="px-3 py-2 rounded-2xl text-sm" style={{ background: C.surface2, color: C.muted }}>En train d'écrire...</div>
          </div>
        )}
      </div>
      <div className="flex items-center gap-2 px-3 py-3" style={{ borderTop: `1px solid ${C.border}` }}>
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Pose ta question..." className="flex-1 px-3 py-2 rounded-full text-sm outline-none" style={{ border: `1px solid ${C.border}`, background: C.surface2, color: C.text }} />
        <button onClick={send} disabled={loading} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 disabled:opacity-50" style={{ background: C.purple }}><Icon name="send" size={14} color="white" /></button>
      </div>
    </div>
  );
}

      return [...prev, { key, name: product.name, label: option.label, price: option.price, qty: 1, needsId: !!product.needsId }];
